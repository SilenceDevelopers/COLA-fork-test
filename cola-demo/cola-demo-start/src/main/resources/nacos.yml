server:
  port: 8092
  servlet:
    context-path: /cola-demo/

dubbo:
  application: #当前这个应用的信息
    name: cola-demo #应用名
    qos-port: 22221
  protocol: # 服务采用的协议 基本默认未dubbo协议(netty)
    name: dubbo
    port: 20880 #dubbo服务暴露的端口
    ext-protocol: tri
    preferred-protocol: tri
  registry: #注册相关信息
    #address: zookeeper://10.250.204.106:2181 #注册中心配置
    address: nacos://192.168.78.201:8848 #注册中心配置
    timeout: 30000 # 到注册中心的超时时间
    namespace: xhcc
    group: xunheng-cloud-cola
    username: nacos
    password: nacos
  provider:
    retries: -1 #重试次数 consumer
    delay: -1 #延迟到spring容器加载之后
  scan: #需要发布的服务接口实现类扫描路径
    base-packages: com.alibaba.demo.dubbo.api.impl
  consumer:
    check: false

spring:
  # 数据源
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://192.168.78.201:3306/store?useUnicode=true&characterEncoding=utf-8&useSSL=false
    username: root
    password: 123456
  # cloud:
  #   alibaba:
  #     seata:
  #       tx-service-group: default


rocketmq:
  name-server: 192.168.78.201:9876
  consumer:
    group: consumer_test

seata:
  registry: # TC服务注册中心的配置，微服务根据这些信息去注册中心获取tc服务地址
    type: nacos # 注册中心类型 nacos
    nacos:
      server-addr: 192.168.78.201:8848 # nacos地址
      namespace: seata # namespace，默认为空
      group: SEATA_GROUP # 分组，默认是DEFAULT_GROUP
      application: seata-server # seata服务名称
      username: nacos
      password: nacos
  tx-service-group: default # 事务组名称
  service:
    vgroup-mapping: # 事务组与tc集群的映射关系
      default: "default"
  data-source-proxy-mode: AT
  enable: true

xxl:
  job:
    accessToken: default_token
    admin:
      addresses: http://192.168.1.2:8080/xxl-job-admin
    executor:
      app-name: xxl-job-executor-sample
      ip : localhost
      port: 11014
      logPath: D:\xxl-job\logs

snowflake:
  workerId: 2
  datacenterId: 3

aviator:
  cacheEnabled: true
  cacheSize: 5000
  timeoutMs: 1000
  functions:
    - com.alibaba.demo.aviatorFunction.DateInRangeFunction
