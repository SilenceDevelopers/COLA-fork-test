spring:
  application:
    name: cola-demo
  cloud:
    nacos:
      username: nacos
      password: nacos
      server-addr: 192.168.78.201:8848 #nacos的地址
      #server-addr: 192.168.1.3:8848 #nacos的地址
      discovery:
        namespace: xhcc #当前命名空间 相当于环境
        group: xunheng-cloud-cola #当前组名 相当于项目
      config:
        namespace: xhcc #当前命名空间 相当于环境
        group: xunheng-cloud-cola #当前组名 相当于项目
        file-extension: yml #配置后缀
        shared-configs:
          - data-id: xunheng-common #公共共享配置
            refresh: true
            group: xunheng-cloud-cola
#          - data-id: xunheng-datasource.yml #数据源共享配置
#            refresh: true
#            group: xunheng-cloud-cola
          - data-id: redis
            refresh: true
            group: xunheng-cloud-cola
